[project]
name = "image-crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kw" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "rich>=15.0.0",
    "torch>=2.15.0",
    "transformers>=5.24.0",
    "typer>=0.29.2",
]

[project.scripts]
image-crawler = "image_crawler:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
